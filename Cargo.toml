[package]
name = "moestream"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Experimental storage-aware Mixture-of-Experts inference runtime for consumer hardware"
license = "MIT"
repository = "https://github.com/hasnocool/MoEStream"
readme = "README.md"
keywords = ["llm", "moe", "inference", "nvme", "local-ai"]
categories = ["command-line-utilities", "science"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.20"
